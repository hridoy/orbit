<!DOCTYPE html>
<html lang="en" data-accent="orange">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare — Account Home</title>
  <link rel="icon" type="image/svg+xml" href="../assets/cloudflare-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/kumo-tokens.css">
  <link rel="stylesheet" href="../styles/kumo-base.css">
  <link rel="stylesheet" href="../styles/kumo-sidebar.css">
  <link rel="stylesheet" href="../styles/kumo-header.css">
  <link rel="stylesheet" href="../styles/kumo-cards.css">
  <link rel="stylesheet" href="../styles/kumo-tables.css">
  <link rel="stylesheet" href="../styles/kumo-components.css">
  <link rel="stylesheet" href="../styles/kumo-modals.css">
  <link rel="stylesheet" href="../styles/kumo-pages.css">
  <link rel="stylesheet" href="../styles/kumo-customizer.css">
  <link rel="stylesheet" href="../styles/kumo-responsive.css">
</head>
<body>
  <div class="mobile-sidebar-backdrop" id="cf-mobile-backdrop" onclick="toggleMobileSidebar(false)"></div>
  <div class="kumo-shell">
    <aside class="kumo-sidebar" id="cf-sidebar-container"></aside>
    <div class="kumo-main">
      <header class="kumo-header" id="cf-header-container"></header>
      <main class="kumo-content" id="cf-app-viewport"></main>
    </div>
  </div>
  <div id="cf-modal-container"></div>

  <!-- Quick Search Spotlight Modal -->
  <div class="cf-command-backdrop" id="cf-quick-search-backdrop" style="display: none;" onclick="if(event.target === this) closeQuickSearch()">
    <div class="cf-command-palette">
      <div class="cf-command-search-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cf-quick-search-input" type="text" placeholder="Quick search..." oninput="handleSearchInput()" />
        <button class="btn-cf btn-cf-secondary btn-cf-sm" onclick="closeQuickSearch()">Esc</button>
      </div>
      <div class="cf-command-results" id="cf-quick-search-results"></div>
    </div>
  </div>

  <script src="../scripts/mock-data.js"></script>
  <script src="../scripts/icons.js"></script>
  <script src="../scripts/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('home');
    });
  </script>
</body>
</html>
