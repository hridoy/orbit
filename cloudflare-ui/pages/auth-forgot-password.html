<!DOCTYPE html>
<html lang="en" data-accent="orange">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare — Reset your password</title>
  <link rel="icon" type="image/svg+xml" href="../assets/cloudflare-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/kumo-tokens.css">
  <link rel="stylesheet" href="../styles/kumo-base.css">
  <link rel="stylesheet" href="../styles/kumo-components.css">
  <link rel="stylesheet" href="../styles/kumo-pages.css">
</head>
<body>
  <div class="auth-split-wrapper">
    <div class="auth-hero-pane">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <img src="../assets/cloudflare-logo.svg" alt="Cloudflare" style="height: 32px;" />
        <span style="font-size: 1.25rem; font-weight: 700;">Cloudflare</span>
      </div>
      <div>
        <h2 style="font-size: 2.25rem; font-weight: 700; line-height: 1.2; margin-bottom: 1rem;">
          Account Security & Recovery
        </h2>
        <p style="font-size: 1rem; color: #94a3b8; max-width: 480px; line-height: 1.5;">
          Follow the verification link sent to your registered email address to securely restore access to your Cloudflare dashboard.
        </p>
      </div>
      <div style="font-size: 0.8rem; color: #64748b;">
        © 2026 Cloudflare, Inc.
      </div>
    </div>

    <div class="auth-card-pane">
      <h1>Reset password</h1>
      <p>Enter your email and we'll send you instructions to reset your password.</p>

      <form onsubmit="event.preventDefault(); alert('Password reset link sent to your email.'); window.location.href='auth-login.html';">
        <div class="cf-form-group">
          <label>Email address</label>
          <input type="email" class="cf-input" placeholder="hridoy@duck.com" required />
        </div>

        <button type="submit" class="btn-cf btn-cf-primary" style="width: 100%; justify-content: center; height: 42px; margin-top: 1rem;">
          Send Reset Instructions
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.84rem;">
        <a href="auth-login.html" style="color: var(--cf-brand-orange); text-decoration: none;">← Back to login</a>
      </div>
    </div>
  </div>
</body>
</html>
